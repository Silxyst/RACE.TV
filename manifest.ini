; ========================================
; RACE TV // Streamer HUD: uma janela real por elemento.
; Cada janela pode ser redirecionada ao OBS pelo app
; "OBS Apps Redirection" (textura "Extra: Redirected apps").
; NAO edite este arquivo a mao: o CSP/Content Manager pode
; reescreve-lo. Ajustes em TV Settings dentro do jogo.
; ========================================

[ABOUT]
NAME = Race TV Streamer HUD
AUTHOR = Streamer HUD Lab
VERSION = 12.3.0
DESCRIPTION = Broadcast Glass HUD compatible with Real Penalty servers: live penalty badges, warnings and safety-car flags from lobby chat.
URL = https://github.com/Silxyst/RACE.TV

[CORE]
LAZY = NONE

[WINDOW_...]
NAME = TV Tower
ICON = icon.png
PADDING = 0,0
FUNCTION_MAIN = vsTowerMain
FUNCTION_ON_SHOW = vsTowerShow
FUNCTION_ON_HIDE = vsTowerHide
SIZE = 400, 446
FLAGS = NO_TITLE_BAR, NO_COLLAPSE, NO_BACKGROUND, NO_SCROLLBAR, FIXED_SIZE

