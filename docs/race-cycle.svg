<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="250" viewBox="0 0 1200 250" role="img" aria-label="Transmissão RACE TV: torre, batalha, delta, resultados"><title>Do grid ao pódio — a transmissão RACE TV</title><defs><linearGradient id="rcTrack" x1="0" y1="0" x2="1060" y2="0" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#1E90FF"/><stop offset=".5" stop-color="#FFD700"/><stop offset="1" stop-color="#00b450"/></linearGradient><filter id="rcSoft" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="6"/></filter></defs><rect width="1200" height="250" rx="20" fill="#0a0f1a"/><rect width="1200" height="250" rx="20" fill="none" stroke="#2c3e5c"/><circle cx="212" cy="30" r="5" fill="#E10600"><animate attributeName="opacity" values="1;.25;1" dur="1.2s" repeatCount="indefinite"/></circle><text x="228" y="35" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="800" letter-spacing="3" fill="#9fb2c1">DO GRID AO PÓDIO — A TRANSMISSÃO RACE TV</text><text x="1066" y="35" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="700" letter-spacing="2" fill="#E10600">NO AR</text><rect x="70" y="58" width="1060" height="6" rx="3" fill="#1c2836"/><rect x="70" y="58" width="1060" height="6" rx="3" fill="url(#rcTrack)" opacity=".35"/><circle cx="70" cy="61" r="7" fill="#1E90FF" filter="url(#rcSoft)"><animateMotion path="M0 0 H1060" dur="8s" repeatCount="indefinite"/></circle><circle cx="70" cy="61" r="4" fill="#ffffff"><animateMotion path="M0 0 H1060" dur="8s" repeatCount="indefinite"/></circle><g font-family="Arial, Helvetica, sans-serif"><g opacity="1"><animate attributeName="opacity" values="1;.42;.42;.42;1" keyTimes="0;.25;.5;.75;1" dur="8s" repeatCount="indefinite"/><rect x="70" y="90" width="248" height="118" rx="14" fill="#0e1626" stroke="#1E90FF" stroke-width="2"/><circle cx="96" cy="114" r="7" fill="#1E90FF"/><text x="112" y="119" font-size="13" font-weight="800" letter-spacing="1" fill="#EAF2F8">TV TOWER</text><text x="96" y="146" font-size="12" fill="#8fa2b1">Classificação ao vivo,</text><text x="96" y="164" font-size="12" fill="#8fa2b1">clique para focar</text><text x="96" y="190" font-size="11" font-weight="700" fill="#7db9ff">1 • LARGADA</text></g><g opacity=".42"><animate attributeName="opacity" values=".42;1;.42;.42;.42" keyTimes="0;.25;.5;.75;1" dur="8s" repeatCount="indefinite"/><rect x="342" y="90" width="248" height="118" rx="14" fill="#0e1626" stroke="#FFD700" stroke-width="2"/><circle cx="368" cy="114" r="7" fill="#FFD700"/><text x="384" y="119" font-size="13" font-weight="800" letter-spacing="1" fill="#EAF2F8">TV BATTLE</text><text x="368" y="146" font-size="12" fill="#8fa2b1">Duelo P2 x P3,</text><text x="368" y="164" font-size="12" fill="#8fa2b1">volta e tendência</text><text x="368" y="190" font-size="11" font-weight="700" fill="#FFD700">2 • DUELO</text></g><g opacity=".42"><animate attributeName="opacity" values=".42;.42;1;.42;.42" keyTimes="0;.25;.5;.75;1" dur="8s" repeatCount="indefinite"/><rect x="614" y="90" width="248" height="118" rx="14" fill="#0e1626" stroke="#00b450" stroke-width="2"/><circle cx="640" cy="114" r="7" fill="#00b450"/><text x="656" y="119" font-size="13" font-weight="800" letter-spacing="1" fill="#EAF2F8">DELTA + MAPA</text><text x="640" y="146" font-size="12" fill="#8fa2b1">Previsão e traçado,</text><text x="640" y="164" font-size="12" fill="#8fa2b1">rivais ±8s</text><text x="640" y="190" font-size="11" font-weight="700" fill="#00e070">3 • DECISÃO</text></g><g opacity=".42"><animate attributeName="opacity" values=".42;.42;.42;1;.42" keyTimes="0;.25;.5;.75;1" dur="8s" repeatCount="indefinite"/><rect x="886" y="90" width="248" height="118" rx="14" fill="#0e1626" stroke="#E10600" stroke-width="2"/><circle cx="912" cy="114" r="7" fill="#E10600"/><text x="928" y="119" font-size="13" font-weight="800" letter-spacing="1" fill="#EAF2F8">RESULTADOS</text><text x="912" y="146" font-size="12" fill="#8fa2b1">Pódio, tabela e recorde,</text><text x="912" y="164" font-size="12" fill="#8fa2b1">narrador comanda</text><text x="912" y="190" font-size="11" font-weight="700" fill="#ff6b60">4 • PÓDIO</text></g></g><text x="326" y="162" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="800" fill="#3b4c5e">›</text><text x="598" y="162" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="800" fill="#3b4c5e">›</text><text x="870" y="162" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="800" fill="#3b4c5e">›</text><text x="600" y="234" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#64798a">Janelas somem da tela e seguem renderizando no OBS via redirect</text></svg>